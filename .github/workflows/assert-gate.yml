name: ASSERT safety gate

# Two behaviors, one gate. Every pull request re-runs both evals against the
# agent as changed, pairs the results case-by-case with the committed baseline,
# and fails only on a statistically significant regression -- not on a fixed
# threshold, which would flag ordinary run-to-run noise.
#
# This costs real model calls. It runs on pull requests, on merges to main,
# and on demand -- never on every push to a feature branch. The merges-to-main
# run is what publishes the trusted baseline the next PR compares against.

on:
  pull_request:
    paths:
      - 'bank_agent/**'
      - 'eval/behaviors/**'
      - '.github/workflows/assert-gate.yml'
  push:
    branches: [main]
    paths:
      - 'bank_agent/**'
      - 'eval/behaviors/**'
      - '.github/workflows/assert-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  safety-gate:
    name: ASSERT safety regression gate
    runs-on: ubuntu-latest
    env:
      # The agents resolve their Azure deployment from AGENT_MODEL and fall back
      # to "gpt-4o-mini", which is not deployed on the endpoint this demo uses --
      # the gate fails with DeploymentNotFound rather than a useful message. This
      # is a deployment name, not a credential, so it belongs here and not in
      # secrets. Change it to whatever your own endpoint serves.
      AGENT_MODEL: gpt-5.4
    steps:
      - uses: actions/checkout@v4

      - name: Gate on paired safety regressions
        uses: responsibleai/assert-ai-action@v1
        with:
          # One behavior per YAML, so each file becomes its own gated behavior
          # with its own artifact root and its own paired comparison.
          configs: eval/behaviors/*.yaml

          # Baseline lookup: the action searches the most recent successful run
          # on `baseline-branch` for a live artifact named `assert-ai-baseline`
          # and downloads it as this PR's paired comparator. The uploader is
          # the second step below -- both halves are required. Without them,
          # every run is a FirstRun and the gate never actually gates.
          baseline: assert-ai-baseline
          baseline-branch: main

          # The agent is a LangGraph ReAct agent that spawns MCP servers as
          # stdio subprocesses, so the gate needs this repo importable for the
          # target to resolve `bank_agent.*`.
          #
          # The second `pip install` reinstalls assert-ai from a pinned SHA on
          # ASSERT's main. `assert-ai==0.1.0` on PyPI ships an unbounded
          # `arize-phoenix>=15.0.0` constraint that resolves to 20.1.0 and
          # crashes at import on Python 3.11 with
          #     ValueError: mutable default <class 'mappingproxy'>
          #                 for field boolean_names is not allowed
          # ASSERT main already caps `arize-phoenix<19.18.0` (commit 232baefe),
          # but no new PyPI release has been cut. Pinning the SHA (not `main`)
          # is required because paired McNemar demands an identical harness
          # build between the baseline run and each PR run -- a moving branch
          # ref would manufacture fake regressions. Remove this override once
          # assert-ai 0.1.1+ ships to PyPI.
          target-install: |
            pip install -r requirements.txt
            pip install --force-reinstall \
              "assert-ai[regression,otel,langgraph,acs] @ git+https://github.com/responsibleai/ASSERT.git@6dd358ca7398"
          # `acs` is needed by the tier-authorization Rego arm; `regression`
          # is what the paired statistical test needs.
          extras: 'regression,otel,langgraph,acs'

          # Provider credentials by NAME only -- values stay in repo secrets.
          provider-env: |
            AZURE_API_KEY=${{ secrets.AZURE_API_KEY }}
            AZURE_API_BASE=${{ secrets.AZURE_API_BASE }}
            AZURE_API_VERSION=${{ secrets.AZURE_API_VERSION }}

          post-pr-comment: 'true'

      # Publish the trusted baseline only on non-PR events. A PR must not be
      # able to overwrite the baseline it is compared against, so this step is
      # deliberately skipped for `pull_request`. The 90-day retention window
      # matches what a stable-cadence project needs before its next baseline
      # run naturally supersedes this one.
      - name: Publish baseline artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: assert-ai-baseline
          path: assert-ai-artifacts/
          retention-days: 90

