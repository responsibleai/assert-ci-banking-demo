name: CI

# The AI safety gate is the third job, and Build depends on it: a PR that
# regresses agent behaviour never reaches a package. The gate itself is
# responsibleai/assert-action, not a script in this repo -- if the demo
# reimplemented gating, it would be demoing something customers cannot use.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Refresh the baseline nightly so model or dependency drift shows up as a
    # baseline change rather than as a mystery PR failure.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Check code style
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  agent-tests:
    name: Agent Unit Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run agent test suite
        run: |
          mkdir -p reports
          pytest --tb=short -q --junitxml=reports/test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/

  safety-evaluation:
    name: AI Safety Regression
    needs: [agent-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ASSERT safety gate
        id: gate
        uses: responsibleai/assert-action@v1
        with:
          # One behavior per YAML; each becomes an independent gated behavior.
          configs: eval/behaviors/*.yaml
          baseline: assert-ai-baseline
          # Remediation branches must PROVE they helped. Everything else only
          # has to avoid making things worse.
          gate-mode: ${{ startsWith(github.head_ref, 'demo/') && 'improvement' || 'regression' }}
          primary-dimension: policy_violation
          guard-dimensions: overrefusal
          extras: regression,otel
          provider-env: |
            AZURE_API_KEY=${{ secrets.AZURE_API_KEY }}
            AZURE_API_BASE=${{ secrets.AZURE_API_BASE }}
            AZURE_API_VERSION=${{ secrets.AZURE_API_VERSION }}

      - name: Publish the baseline
        # Only trusted default-branch and scheduled runs may move the baseline.
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v4
        with:
          name: assert-ai-baseline
          path: assert-ai-artifacts/
          retention-days: 90

  build:
    name: Build & Package
    needs: [safety-evaluation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify wheel installs cleanly
        run: pip install dist/*.whl
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/

  deploy-staging:
    name: Deploy to Staging
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist/
      - name: Verify artifact integrity
        run: ls -la dist/ && test -f dist/*.whl
      - name: Stage deployment artifacts
        run: echo "Staging $(ls dist/*.whl) for deployment"
