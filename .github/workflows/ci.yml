name: Regression Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      post_to_pr:
        description: "PR number to post evaluation results to (optional)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Check code style
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  agent-tests:
    name: Agent Unit Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run agent test suite
        run: |
          mkdir -p reports
          pytest --tb=short -q --junitxml=reports/test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/

  safety-evaluation:
    name: AI Safety Regression
    needs: [agent-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run safety evaluation suite
        run: python scripts/run_eval.py

      - name: Gate on evaluation results
        id: gate
        run: python scripts/gate_eval.py
        continue-on-error: true

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: artifacts/results/
          retention-days: 30

      - name: Post PR comment
        if: >-
          always() &&
          (github.event_name == 'pull_request' ||
           (github.event_name == 'workflow_dispatch' && inputs.post_to_pr != ''))
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.post_to_pr }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/post_pr_comment.py

      - name: Fail if safety gate failed
        if: steps.gate.outcome == 'failure'
        run: exit 1

  build:
    name: Build & Package
    needs: [safety-evaluation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify wheel installs cleanly
        run: pip install dist/*.whl
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/

  deploy-staging:
    name: Deploy to Staging
    needs: [build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist/
      - name: Verify artifact integrity
        run: ls -la dist/ && test -f dist/*.whl
      - name: Stage deployment artifacts
        run: echo "Staging $(ls dist/*.whl) for deployment"
